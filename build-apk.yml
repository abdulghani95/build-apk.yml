name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - build_android.py
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: python3 build_android.py

      - name: Build APK
        run: gradle -p android-build assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android-build/app/build/outputs/apk/release/app-release.apk trex-konkan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: trex-konkan-apk
          path: trex-konkan.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest trex-konkan.apk \
            --title "تطبيق تركس وكونكان" \
            --notes "نزّل الملف trex-konkan.apk وثبّته على الجوال."
